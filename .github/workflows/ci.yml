name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: workforce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/workforce_ci
      DATABASE_URL: postgresql://workforce_app:local-development-only@127.0.0.1:5432/workforce_ci
      TEST_DATABASE_URL: postgresql://workforce_app:local-development-only@127.0.0.1:5432/workforce_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Prepare isolated PostgreSQL runtime role
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-role.sql
      - name: Apply and replay migrations
        run: |
          npm run migrate
          npm run migrate
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Build Next.js
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chrome
          npm run test:e2e
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build deployable web and worker image
        run: docker build --tag workforce-intelligence:ci .
      - name: Compile Azure Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/container-apps.bicep --outfile /tmp/container-apps.json
