services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workforce
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - workforce_data:/var/lib/postgresql/data
      - ./scripts/init-role.sql:/docker-entrypoint-initdb.d/010-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workforce"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  workforce_data:
